<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O'Clock — a clock that only shows what you're doing now</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Gochi Hand'; src: url(fonts/gochi-hand.woff2) format('woff2'); font-display: swap; }
  @font-face { font-family: 'Caveat'; src: url(fonts/caveat.woff2) format('woff2'); font-weight: 700; font-display: swap; }
  @font-face { font-family: 'Nanum Pen'; src: url(fonts/nanum-pen.woff2) format('woff2'); font-display: swap; }
  @font-face { font-family: 'Gaegu'; src: url(fonts/gaegu.woff2) format('woff2'); font-weight: 700; font-display: swap; }
  @font-face { font-family: 'Permanent Marker'; src: url(fonts/permanent-marker.woff2) format('woff2'); font-display: swap; }
  :root { --hand: 'Nanum Pen'; --hand-size: 1.4; }
  @font-face { font-family: 'Caveat Brush'; src: url(fonts/caveat-brush.woff2) format('woff2'); font-display: swap; }

    --bg: #F7F7F7;
    --ink: #1F1F1F;
    --ink-2: #707070;
    --line: #E6E6E6;
    --chip: #FFFFFF;
  }

  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'Nanum Pen', 'Gochi Hand', cursive; -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  header { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; padding: 24px clamp(16px, 4vw, 40px) 0; }
  .title { display: flex; flex-direction: column; gap: 4px; }
  .title h1 { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 50px; font-weight: 400; line-height: 1; letter-spacing: 0.5px; }
  .title p { margin: 0; font-size: 24px; line-height: 1.1; color: var(--ink-2); }
  .toggles { display: flex; gap: 10px; flex-wrap: wrap; }
  .seg { display: inline-flex; background: var(--line); border-radius: 999px; padding: 3px; }
  .seg button { appearance: none; border: 0; background: transparent; color: var(--ink-2); font: 400 23px/1 'Nanum Pen', cursive; padding: 8px 14px; min-height: 36px; border-radius: 999px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--chip); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.10); }
  .seg.icons button { width: 44px; padding: 0; display: grid; place-items: center; }
  .seg.icons svg { width: 20px; height: 20px; }
  .stage, .phone { transition: opacity .35s ease, transform .45s cubic-bezier(.2,.8,.2,1); }
  main { position: relative; }
  body:not(.view-phone) .phone, body.view-phone .stage { position: absolute; opacity: 0; transform: scale(.94) translateY(8px); pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .stage, .phone { transition: none; } }
  main { flex: 1; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: clamp(24px, 5vw, 72px); padding: 12px; min-height: 0; }
  .stage { position: relative; width: min(62vh, 88vw, 560px); aspect-ratio: 1; }
  @media (max-width: 760px) { .stage { width: min(86vw, 420px); } }
  .stage svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .phone { display: block; position: relative; width: min(620px, 90vw, 90vh); aspect-ratio: 1125 / 800; -webkit-mask-image: linear-gradient(to bottom, #000 92%, transparent); mask-image: linear-gradient(to bottom, #000 92%, transparent); overflow: hidden; container-type: inline-size; }
  .phone .shot { position: absolute; left: 0; top: 0; width: 100%; height: auto; }
  /* official iOS 27 kit: small widget slot 164x164 at (211.33, 90) on the 402-wide screen; the render adds 24 (x) and 23.2 (y) of bezel on a 450-wide image */
  .wslot { position: absolute; left: calc((24 + 211.33) / 450 * 100%); top: calc((23.2 + 90) / 450 * 100cqw); width: calc(164 / 450 * 100%); aspect-ratio: 1; border-radius: 22.5%; overflow: visible; background: #FFFFFF; box-shadow: 0 calc(4 / 450 * 100cqw) calc(14 / 450 * 100cqw) rgba(0,0,0,.06); transition: background-color .5s ease; }
  .psb { position: absolute; left: calc(50 / 450 * 100%); right: calc(48 / 450 * 100%); top: calc(48 / 450 * 100cqw); display: flex; justify-content: space-between; align-items: center; font: 600 calc(17 / 450 * 100cqw) / 1 -apple-system, 'SF Pro Text', Inter, sans-serif; color: #1C1C1E; letter-spacing: -.02em; }
  .psb svg { height: calc(13 / 450 * 100cqw); width: auto; }
  .wslot svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .wname { color: #1C1C1E !important; text-shadow: none !important; } .wname { position: absolute; left: calc((24 + 211.33) / 450 * 100%); width: calc(164 / 450 * 100%); top: calc((23.2 + 90 + 170) / 450 * 100cqw); text-align: center; font: 500 calc(12 / 450 * 100cqw) / 1 -apple-system, 'SF Pro Text', Inter, sans-serif; text-shadow: 0 1px 3px rgba(0,0,0,.35); }
  footer { padding: 0 clamp(16px, 4vw, 40px) 48px; }
  .bar { display: flex; align-items: center; gap: 14px; }
  .play { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; display: grid; place-items: center; cursor: pointer; }
  .play svg { width: 16px; height: 16px; }
  .clock-read { flex: none; width: 92px; font-size: 28px; line-height: 1; }
  .track { position: relative; flex: 1; height: 44px; cursor: pointer; touch-action: none; }
  .rail { position: absolute; left: 0; right: 0; top: 19px; height: 6px; border-radius: 3px; background: var(--line); }
  .segment { position: absolute; top: 9px; height: 26px; border-radius: 7px; border: 0; padding: 0 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; font: 400 23px/1 'Nanum Pen', cursive; letter-spacing: .2px; border-radius: 9px 6px 10px 5px / 6px 10px 5px 9px; white-space: nowrap; cursor: pointer; container-type: inline-size; }
  .segment span { display: block; }
  @container (max-width: 38px) { .segment span { display: none; } }
  .playhead { position: absolute; top: 0; width: 12px; height: 8px; margin-left: -6px; pointer-events: none; }
  .playhead::before { content: ''; position: absolute; inset: 0; background: #E8412C; clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .playhead::after { content: ''; position: absolute; left: 5px; top: 36px; width: 2px; height: 6px; border-radius: 1px; background: #E8412C; }
  .ticks { position: absolute; left: 0; right: 0; top: 44px; height: 22px; font-size: 25px; line-height: 1; color: var(--ink-2); pointer-events: none; }
  .ticks span { position: absolute; transform: translateX(-50%); }
  @media (max-width: 560px) { .clock-read { display: none; } }
  @media (max-width: 760px) { .phone { width: min(92vw, 480px); } }
  .hand-num { font-family: var(--hand), 'Gochi Hand', cursive; font-weight: 700; }
  .hand-tag { font-family: var(--hand), 'Gochi Hand', cursive; font-weight: 700; font-size: calc(22px * var(--hand-size)); }
</style>
</head>
<body>
<header>
  <div class="title">

  </div>
  <div class="toggles">

      <button type="button" data-style="sticker" aria-pressed="true">Sticker</button>
      <button type="button" data-style="marker" aria-pressed="false">Hand-drawn</button>
    </div>
    <div class="seg icons" role="group" aria-label="View">
      <button type="button" data-view="dial" aria-pressed="true" aria-label="On the web" title="On the web"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 7.5h15" stroke="currentColor" stroke-width="1.8"/><circle cx="5" cy="5.5" r=".8" fill="currentColor"/><circle cx="7.4" cy="5.5" r=".8" fill="currentColor"/></svg></button>
      <button type="button" data-view="phone" aria-pressed="false" aria-label="On iPhone widget" title="On iPhone widget"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5.5" y="2.5" width="9" height="15" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="8.4" y="4.4" width="3.2" height="1.2" rx=".6" fill="currentColor"/></svg></button>
    </div>
  </div>
</header>

<main>
  <div class="stage"><svg id="dialBig" viewBox="0 0 400 400" role="img" aria-label="Schedule clock"></svg></div>
  <div class="phone" aria-label="iPhone home screen with the Time To widget">

    <div class="wslot" id="wBig"><svg id="dialSmall" viewBox="0 0 400 400" role="img" aria-label="Time To widget"></svg></div>
    <div class="wname">Time To</div>
    <div class="psb"><span>9:41</span><svg viewBox="0 0 72 14" aria-hidden="true"><rect x="0" y="9" width="3.4" height="5" rx="1" fill="#1C1C1E"/><rect x="5.4" y="6" width="3.4" height="8" rx="1" fill="#1C1C1E"/><rect x="10.8" y="3" width="3.4" height="11" rx="1" fill="#1C1C1E"/><rect x="16.2" y="0" width="3.4" height="14" rx="1" fill="#1C1C1E"/><path d="M33 13.5l2.4-2.8a3.6 3.6 0 0 0-4.8 0z M33 7.2a7 7 0 0 1 4.8 2l1.5-1.7a9.4 9.4 0 0 0-12.6 0l1.5 1.7A7 7 0 0 1 33 7.2z M33 1.6a12.6 12.6 0 0 0-8.5 3.4l1.5 1.7a10.2 10.2 0 0 1 14 0l1.5-1.7A12.6 12.6 0 0 0 33 1.6z" fill="#1C1C1E"/><rect x="45.5" y="1.5" width="23" height="11" rx="3.5" fill="none" stroke="#1C1C1E" stroke-opacity=".4"/><rect x="47.5" y="3.5" width="19" height="7" rx="2" fill="#1C1C1E"/><path d="M70 5.5v3a1.6 1.6 0 0 0 0-3z" fill="#1C1C1E" fill-opacity=".4"/></svg></div>
  </div>
</main>

<footer>
  <div class="bar">
    <button class="play" id="play" type="button" aria-label="Pause"></button>
    <div class="clock-read" id="readout"></div>
    <div class="track" id="track" aria-label="Time of day" role="slider" aria-valuemin="7" aria-valuemax="22" tabindex="0">
      <div class="rail"></div>
      <div id="segments"></div>
      <div class="playhead" id="playhead"></div>
      <div class="ticks" id="ticks"></div>
    </div>
  </div>
</footer>
